name: CI

on:
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Publish a nightly release from main after all checks pass
        required: false
        default: false
        type: boolean

concurrency:
  group: github-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality and race
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Quality and race
        run: scripts/ci/quality.sh

  platform-tests:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Build CLI
        run: go build ./cmd/turnal

  stable-release:
    name: Publish stable release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-nightly.')
    needs:
      - quality
      - platform-tests
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      channel: stable
    secrets: inherit

  nightly-release:
    name: Publish nightly release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nightly && github.ref == 'refs/heads/main'
    needs:
      - quality
      - platform-tests
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      channel: nightly
    secrets: inherit
