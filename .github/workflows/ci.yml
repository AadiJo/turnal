name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Validate, rehearse a release, or publish a nightly release
        required: true
        default: validate
        type: choice
        options:
          - validate
          - rehearse
          - nightly

concurrency:
  group: github-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality and race
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      stable_release: ${{ steps.stable-ref.outputs.eligible }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Quality and race
        run: scripts/ci/quality.sh
      - id: stable-ref
        name: Classify stable release ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          eligible=false
          if [[ "$EVENT_NAME" == push &&
                "$REF_TYPE" == tag &&
                "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ &&
                "$REF_NAME" != *-nightly.* ]]; then
            eligible=true
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

  platform-tests:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            test-installer: true
          - name: macos
            os: macos-15
            test-installer: true
          - name: windows
            os: windows-2025
            test-installer: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Test standalone installer
        if: matrix.test-installer
        run: sh scripts/test-install.sh
      - name: Build CLI
        run: go build ./cmd/turnal

  stable-release:
    name: Publish stable release
    if: needs.quality.outputs.stable_release == 'true'
    needs:
      - quality
      - platform-tests
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      channel: stable
      publish: true
    secrets: inherit

  nightly-release:
    name: Publish nightly release
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'nightly' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - platform-tests
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      channel: nightly
      publish: true
    secrets: inherit

  release-rehearsal:
    name: Rehearse release
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode == 'rehearse' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - platform-tests
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      channel: nightly
      publish: false
    secrets: inherit
