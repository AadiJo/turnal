name: Publish release

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel selected by the gated CI workflow
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.channel }} release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Validate release request
        shell: bash
        run: |
          case "${{ inputs.channel }}" in
            stable|nightly) ;;
            *)
              echo "release invariant failed: unsupported channel ${{ inputs.channel }}" >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - id: nightly_date
        if: inputs.channel == 'nightly'
        name: Resolve nightly date
        shell: bash
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - id: release_meta
        name: Resolve release metadata
        shell: bash
        run: |
          if [[ "${{ inputs.channel }}" == "nightly" ]]; then
            node scripts/resolve-release.js nightly \
              "${{ steps.nightly_date.outputs.value }}" \
              "${{ github.run_number }}" \
              "${{ github.sha }}"
          else
            node scripts/resolve-release.js stable "${{ github.ref_name }}"
          fi

      - name: Validate stable tag
        if: inputs.channel == 'stable'
        shell: bash
        run: |
          if [[ "${{ steps.release_meta.outputs.tag }}" != "${{ github.ref_name }}" ]]; then
            echo "release invariant failed: resolved tag ${{ steps.release_meta.outputs.tag }} does not match ${{ github.ref_name }}" >&2
            exit 1
          fi

      - name: Align package version
        run: node scripts/set-release-version.js "${{ steps.release_meta.outputs.version }}"

      - name: Test package
        run: npm test

      - name: Build CLI
        run: npm run build

      - name: Pack dry run
        env:
          TURNAL_RELEASE_CHANNEL: ${{ steps.release_meta.outputs.channel }}
          TURNAL_COMMIT: ${{ github.sha }}
        run: npm run pack:dry-run

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: turnal.spdx.json
          upload-artifact: false

      - name: Publish npm package
        env:
          TURNAL_RELEASE_CHANNEL: ${{ steps.release_meta.outputs.channel }}
          TURNAL_COMMIT: ${{ github.sha }}
        run: npm publish --provenance --access public --tag "${{ steps.release_meta.outputs.npm_tag }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(
            "${{ steps.release_meta.outputs.tag }}"
            turnal.spdx.json
            --target "${{ github.sha }}"
            --title "${{ steps.release_meta.outputs.name }}"
            --generate-notes
          )
          if [[ "${{ steps.release_meta.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ "${{ inputs.channel }}" == "stable" ]]; then
            args+=(--verify-tag)
          fi
          if [[ "${{ steps.release_meta.outputs.make_latest }}" == "false" ]]; then
            args+=(--latest=false)
          fi
          gh release create "${args[@]}"
