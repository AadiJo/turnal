version: 2.1

orbs:
  win: circleci/windows@5.1.1

parameters:
  publish_nightly:
    type: boolean
    default: false
  rehearse_release:
    type: boolean
    default: false

commands:
  restore_go_modules:
    steps:
      - restore_cache:
          keys:
            - go-mod-v2-{{ arch }}-{{ checksum "go.sum" }}
            - go-mod-v2-{{ arch }}-
      - run:
          name: Download Go modules
          command: go mod download
      - save_cache:
          key: go-mod-v2-{{ arch }}-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod

jobs:
  quality:
    docker:
      - image: cimg/go:1.26.5
    resource_class: small
    steps:
      - checkout
      - restore_go_modules
      - run:
          name: Quality and race
          command: scripts/ci/quality.sh

  test_linux:
    docker:
      - image: cimg/go:1.26.5
    resource_class: small
    steps:
      - checkout
      - restore_go_modules
      - run:
          name: Test
          command: go test ./...
      - run:
          name: Build CLI
          command: go build ./cmd/turnal

  test_macos:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Install Go
          command: |
            case "$(uname -m)" in
              arm64)
                go_arch=arm64
                go_sha256=efb87ff28af9a188d0536ef5d42e63dd52ba8263cd7344a993cc48dd11dedb6a
                ;;
              x86_64)
                go_arch=amd64
                go_sha256=6231d8d3b8f5552ec6cbf6d685bdd5482e1e703214b120e89b3bf0d7bf1ef725
                ;;
              *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            archive="go1.26.5.darwin-${go_arch}.tar.gz"
            curl --fail --location --silent --show-error \
              "https://go.dev/dl/${archive}" \
              --output "/tmp/${archive}"
            echo "${go_sha256}  /tmp/${archive}" | shasum -a 256 --check
            sudo rm -rf /usr/local/go
            sudo tar -C /usr/local -xzf "/tmp/${archive}"
            echo 'export PATH=/usr/local/go/bin:$PATH' >> "$BASH_ENV"
            export PATH="/usr/local/go/bin:$PATH"
            go version
      - restore_cache:
          keys:
            - go-mod-v2-{{ arch }}-{{ checksum "go.sum" }}
            - go-mod-v2-{{ arch }}-
      - run:
          name: Download Go modules
          command: go mod download
      - save_cache:
          key: go-mod-v2-{{ arch }}-{{ checksum "go.sum" }}
          paths:
            - ~/go/pkg/mod
      - run:
          name: Test
          command: go test ./...
      - run:
          name: Build CLI
          command: go build ./cmd/turnal

  test_windows:
    executor:
      name: win/server-2025
      size: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - windows-go-v1-{{ checksum "go.sum" }}
            - windows-go-v1-
      - run:
          name: Install Go, test, and build
          no_output_timeout: 20m
          command: |
            $ErrorActionPreference = "Stop"
            $goVersion = "1.26.5"
            $goSha256 = "97e6b2a833b6d89f9ff17d25419ac0a7e3b482a044e9ab18cdef834bd834fd38"
            $archive = Join-Path $env:TEMP "go$goVersion.windows-amd64.zip"
            $installRoot = Join-Path $env:USERPROFILE "turnal-go-$goVersion"

            curl.exe --fail --location --silent --show-error `
              --output $archive `
              "https://go.dev/dl/go$goVersion.windows-amd64.zip"
            if ($LASTEXITCODE -ne 0) {
              throw "failed to download Go $goVersion"
            }
            $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $goSha256) {
              throw "Go archive checksum mismatch: expected $goSha256, got $actualSha256"
            }
            if (Test-Path $installRoot) {
              Remove-Item -Recurse -Force $installRoot
            }
            New-Item -ItemType Directory -Path $installRoot | Out-Null
            tar.exe -xf $archive -C $installRoot
            if ($LASTEXITCODE -ne 0) {
              throw "failed to extract Go $goVersion"
            }

            $env:Path = "$(Join-Path $installRoot 'go\bin');$env:Path"
            go version
            if ($LASTEXITCODE -ne 0) {
              throw "failed to run Go $goVersion"
            }
            go mod download
            if ($LASTEXITCODE -ne 0) {
              throw "failed to download Go modules"
            }
            go test ./...
            if ($LASTEXITCODE -ne 0) {
              throw "Windows tests failed"
            }
            go build ./cmd/turnal
            if ($LASTEXITCODE -ne 0) {
              throw "Windows CLI build failed"
            }
      - save_cache:
          key: windows-go-v1-{{ checksum "go.sum" }}
          paths:
            - C:\Users\circleci\go\pkg\mod
            - C:\Users\circleci\AppData\Local\go-build

  publish_release:
    parameters:
      channel:
        type: enum
        enum:
          - stable
          - nightly
      publish:
        type: boolean
        default: true
    docker:
      - image: cimg/go:1.26.5-node
    resource_class: small
    steps:
      - checkout
      - restore_go_modules
      - when:
          condition:
            equal:
              - stable
              - << parameters.channel >>
          steps:
            - run:
                name: Ignore nightly tags
                command: |
                  case "$CIRCLE_TAG" in
                    *-nightly.*) circleci-agent step halt ;;
                  esac
      - run:
          name: Verify release runtime
          command: |
            node --version
            npm --version
      - when:
          condition: << parameters.publish >>
          steps:
            - run:
                name: Install publish tools
                command: |
                  sudo npm install --global npm@11.16.0
                  sudo apt-get update
                  sudo apt-get install --yes gh
      - run:
          name: Prepare << parameters.channel >> release
          command: |
            if [[ -z "${NPM_TOKEN:-}" ]]; then
              echo "release invariant failed: NPM_TOKEN is not configured" >&2
              exit 1
            fi
            unset NPM_ID_TOKEN
            export NPM_CONFIG_USERCONFIG=/tmp/turnal-npmrc
            trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
            export NPM_PUBLISH_PROVENANCE=false
            export TURNAL_PUBLISH="<< parameters.publish >>"
            scripts/ci/release.sh \
              "<< parameters.channel >>" \
              "${CIRCLE_TAG:-${CIRCLE_BRANCH:-main}}" \
              "$CIRCLE_BUILD_NUM" \
              "$CIRCLE_SHA1"

workflows:
  ci:
    when:
      and:
        - not: << pipeline.parameters.publish_nightly >>
        - not: << pipeline.parameters.rehearse_release >>
    jobs:
      - quality:
          name: Quality and race
          filters: &all_refs
            tags:
              only: /.*/
      - test_linux:
          name: Test (linux)
          filters: *all_refs
      - test_macos:
          name: Test (macos)
          filters: *all_refs
      - test_windows:
          name: Test (windows)
          filters: *all_refs
      - publish_release:
          name: Publish stable release
          channel: stable
          context:
            - turnal-release
          requires:
            - Quality and race
            - Test (linux)
            - Test (macos)
            - Test (windows)
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$/

  nightly:
    when: << pipeline.parameters.publish_nightly >>
    jobs:
      - quality:
          name: Nightly quality and race
          filters: &main_only
            branches:
              only: main
            tags:
              ignore: /.*/
      - test_linux:
          name: Nightly test (linux)
          filters: *main_only
      - test_macos:
          name: Nightly test (macos)
          filters: *main_only
      - test_windows:
          name: Nightly test (windows)
          filters: *main_only
      - publish_release:
          name: Publish nightly release
          channel: nightly
          context:
            - turnal-release
          requires:
            - Nightly quality and race
            - Nightly test (linux)
            - Nightly test (macos)
            - Nightly test (windows)
          filters: *main_only

  release_rehearsal:
    when: << pipeline.parameters.rehearse_release >>
    jobs:
      - quality:
          name: Rehearsal quality and race
          filters: &rehearsal_main_only
            branches:
              only: main
            tags:
              ignore: /.*/
      - test_linux:
          name: Rehearsal test (linux)
          filters: *rehearsal_main_only
      - test_macos:
          name: Rehearsal test (macos)
          filters: *rehearsal_main_only
      - test_windows:
          name: Rehearsal test (windows)
          filters: *rehearsal_main_only
      - publish_release:
          name: Rehearse release
          channel: nightly
          publish: false
          context:
            - turnal-release
          requires:
            - Rehearsal quality and race
            - Rehearsal test (linux)
            - Rehearsal test (macos)
            - Rehearsal test (windows)
          filters: *rehearsal_main_only
